<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La aventura de Kitty y su amiga</title>
<style>
:root{--pink:#f5b8c9;--deep:#c85f83;--pale:#fff0f4;--beige:#f5ead8;--brown:#745c54;--green:#8dbb9b}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;padding:18px;display:grid;place-items:center;color:var(--brown);font-family:"Trebuchet MS",Arial,sans-serif;background:radial-gradient(circle at 12% 18%,#fff 0 5px,transparent 6px),linear-gradient(135deg,#fff4f5,var(--beige))}
.game{width:min(760px,100%);padding:24px;border:4px solid white;border-radius:28px;background:#ffffffed;box-shadow:0 12px 35px #9a6f6f25;text-align:center}
h1{margin:4px 0 8px;color:var(--deep);font-size:clamp(1.55rem,5vw,2.2rem)}
p{line-height:1.5}
.scene{position:relative;height:230px;margin:18px 0 12px;overflow:hidden;border:3px solid white;border-radius:22px;background:linear-gradient(#dff5ff 0 72%,#bfe0a8 72%)}
.scene:before{content:"";position:absolute;left:0;right:0;bottom:65px;height:65px;background:repeating-linear-gradient(to right,#d7b6a5 0 22px,#e7d2c2 22px 44px);border-block:4px solid white}
.building{position:absolute;bottom:69px;width:52px;border:4px solid white;border-radius:8px 8px 2px 2px;background:#f5b8c9;height:86px}
.building:before{content:"";position:absolute;inset:9px 7px;background:repeating-linear-gradient(to bottom,#fff4c9 0 9px,transparent 9px 18px)}
.b1{left:8%}.b2{left:43%;height:110px;background:#a9c8ed}.b3{right:8%;height:94px;background:#f4d57c}
.stop{position:absolute;z-index:1;bottom:17px;width:25px;height:25px;display:grid;place-items:center;border:3px solid white;border-radius:50%;color:white;background:var(--deep);font-size:12px;font-weight:bold}
.s1{left:14%}.s2{left:31%}.s3{left:48%}.s4{left:65%}.s5{left:82%}
.traveler{position:absolute;z-index:3;left:4%;bottom:29px;display:flex;gap:2px;font-size:48px;transition:left .8s ease;filter:drop-shadow(0 4px 2px #745c5430)}
.bubble{position:absolute;z-index:4;top:10px;left:50%;width:min(85%,330px);padding:9px;border:2px solid white;border-radius:14px;background:white;color:#a94f71;font-weight:bold;opacity:0;transform:translate(-50%,8px);transition:.25s}
.bubble.show{opacity:1;transform:translate(-50%,0)}
.path{display:flex;align-items:center;gap:4px;margin:18px 4px}
.step{width:34px;height:34px;flex:0 0 34px;display:grid;place-items:center;border:2px solid white;border-radius:50%;background:#eadfd4;color:white;font-weight:bold}
.step.done{background:var(--green)}.step.current{background:var(--deep);transform:scale(1.12)}
.path-line{height:5px;flex:1;background:#eadfd4;border-radius:9px}
.pixel-box{border:3px dashed var(--pink);border-radius:18px;background:var(--pale);padding:18px;margin:16px 0}
.question{font-size:1.15rem;font-weight:bold}.answers{display:grid;gap:10px;margin-top:16px}
button{border:0;border-radius:14px;padding:13px 16px;font:inherit;font-weight:bold;color:var(--brown);background:white;cursor:pointer;box-shadow:0 3px 0 #e7cbd1;transition:.15s}
button:hover{transform:translateY(-2px);background:#fff0f4}
button:focus-visible{outline:3px solid #9a5570;outline-offset:3px}
button:disabled{cursor:default;opacity:.7}
.main{margin-top:12px;color:white;background:var(--deep);box-shadow:0 3px 0 #bd5f7e}
.main:hover{background:#ca6887}
#message{min-height:26px;font-weight:bold}.hidden{display:none}
footer{margin-top:20px;padding-top:13px;border-top:2px dotted #e8c8cf;font-size:.9rem}
@media(max-width:480px){.game{padding:16px}.scene{height:210px}.traveler{font-size:40px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="game">
<h1>🌸 La aventura de Kitty y su amiga 🌸</h1>
<p>Responde 5 preguntas y avanza por el caminito de la cultura digital.</p>
<div class="scene" role="img" aria-label="Una ciudad colorida con dos animalitos aventureros">
<span class="building b1"></span><span class="building b2"></span><span class="building b3"></span>
<span class="stop s1">1</span><span class="stop s2">2</span><span class="stop s3">3</span><span class="stop s4">4</span><span class="stop s5">5</span>
<div id="bubble" class="bubble" aria-live="polite"></div>
<div class="traveler" id="traveler"><span aria-label="gatita">🐱</span><span aria-label="conejita">🐰</span></div>
</div>
<div class="path" id="path" aria-label="Progreso del juego"></div>
<section class="pixel-box" aria-live="polite">
<div id="welcome"><h2>¡Tu aventura comienza aquí! ✨</h2><p>Ayuda a las amigas a llegar al final contestando las preguntas.</p><button class="main" id="start">¡Empezar! 💗</button></div>
<div id="quiz" class="hidden"><p id="counter"></p><div class="question" id="question"></div><div class="answers" id="answers"></div><p id="message"></p><button class="main hidden" id="next">Siguiente pregunta ➜</button></div>
<div id="finish" class="hidden"><h2>¡Lo lograste! 🎉</h2><p id="result"></p><button class="main" id="restart">Jugar otra vez 🔄</button></div>
</section>
<footer><strong>Autora: Cynthia Btzz</strong><br>Semana 2 · Cultura Digital</footer>
</main>
<script>
const questions=[
{q:"¿Qué herramienta sirve para crear y organizar listas de pendientes?",o:["Prezi","Microsoft To Do","SharePoint","Microsoft Forms"],a:1},
{q:"¿Cuál ayuda a organizar y asignar tareas a un equipo?",o:["Microsoft Planner","Prezi","Microsoft Forms","Microsoft To Do"],a:0},
{q:"¿Qué herramienta permite crear presentaciones con zoom y movimiento?",o:["SharePoint","Microsoft Forms","Prezi","Microsoft Planner"],a:2},
{q:"¿Con qué herramienta puedes crear cuestionarios y encuestas?",o:["Microsoft Forms","Microsoft To Do","Prezi","SharePoint"],a:0},
{q:"¿Cuál sirve para compartir documentos y colaborar en equipo?",o:["Prezi","Microsoft Planner","SharePoint","Microsoft Forms"],a:2}
];
let current=0,score=0,timeLeft=120,timer=null,answered=false;
const $=id=>document.getElementById(id);
function drawPath(){ $("path").innerHTML="";questions.forEach((_,i)=>{let s=document.createElement("span");s.className="step"+(i<current?" done":"")+(i===current&&current<5?" current":"");s.textContent=i<current?"✓":i+1;$("path").appendChild(s);if(i<4){let l=document.createElement("span");l.className="path-line";$("path").appendChild(l)}})}
function formatTime(){return `${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,"0")}`}
function showQuestion(){
 answered=false;drawPath();$("counter").textContent=`Pregunta ${current+1} de 5 · Tiempo: ${formatTime()}`;$("question").textContent=questions[current].q;$("message").textContent="";$("next").classList.add("hidden");$("answers").innerHTML="";
 questions[current].o.forEach((option,i)=>{let b=document.createElement("button");b.textContent=option;b.addEventListener("click",()=>{if(answered)return;answered=true;document.querySelectorAll("#answers button").forEach(x=>x.disabled=true);if(i===questions[current].a){score++;$("message").textContent="¡Correcto! 🌸 ¡Muy bien!";$("bubble").textContent="¡Lo estás haciendo genial! 💗";$("bubble").classList.add("show")}else{$("message").textContent="¡Sigue aprendiendo! La respuesta correcta era: "+questions[current].o[questions[current].a]}$("next").classList.remove("hidden")});$("answers").appendChild(b)});
 $("traveler").style.left=(4+current*16)+"%";
}
function finishGame(){clearInterval(timer);$("quiz").classList.add("hidden");$("finish").classList.remove("hidden");$("result").textContent=`Obtuviste ${score} de 5 respuestas correctas. ¡Gracias por jugar! 💕`;$("bubble").classList.remove("show");drawPath()}
function startGame(){clearInterval(timer);current=0;score=0;timeLeft=120;$("welcome").classList.add("hidden");$("finish").classList.add("hidden");$("quiz").classList.remove("hidden");$("bubble").classList.remove("show");showQuestion();timer=setInterval(()=>{timeLeft--;$("counter").textContent=`Pregunta ${current+1} de 5 · Tiempo: ${formatTime()}`;if(timeLeft<=0)finishGame()},1000)}
$("next").addEventListener("click",()=>{current++;if(current>=questions.length)finishGame();else showQuestion()});
$("start").addEventListener("click",startGame);$("restart").addEventListener("click",startGame);drawPath();
</script>
</body>
</html>
